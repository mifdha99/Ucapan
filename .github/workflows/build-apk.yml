name: Build SuaraStudio Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Production Frontend (React + Vite)
        run: npx vite build --base=./

      - name: Verify Frontend Dist Output
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html tidak ditemukan!"; exit 1; }
          ls -la dist/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy Frontend Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/dist
          mkdir -p android/app/src/main/assets/Ucapan
          cp -r dist/* android/app/src/main/assets/dist/
          cp -r dist/* android/app/src/main/assets/Ucapan/
          ls -la android/app/src/main/assets/dist/

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "SUCCESS: APK berhasil dibuat di $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: File APK tidak ditemukan di $APK_PATH"
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuaraStudio-v1.0.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
