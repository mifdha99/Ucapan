name: Build SuaraStudio Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Production Frontend (React + Vite)
        run: npm run build

      - name: Verify Frontend Dist Directory
        run: |
          test -f dist/index.html || { echo "dist/index.html tidak ditemukan!"; exit 1; }
          ls -la dist/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy Frontend Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/
          ls -la android/app/src/main/assets/dist/

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK berhasil dibangun di: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "Gagal: Berkas APK tidak ditemukan di $APK_PATH"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuaraStudio-v1.0.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
